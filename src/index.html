<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d35">
  <title>팁 계산기 | Actions Lab</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">A SMALL TOOL FOR YOUR TABLE</span>
      <h1>한 끼 팁 계산기</h1>
      <p class="intro">식사 금액에 팁을 더하면 얼마일까요?</p>
    </header>
    <section class="calculator" aria-label="팁 계산">
      <form id="calculator-form" novalidate>
        <label for="bill">식사 금액 <span>원</span></label>
        <input id="bill" name="bill" type="number" min="0" max="1000000000" step="1" value="10000" required inputmode="numeric" aria-describedby="error">
        <label for="percent">팁 비율 <span>%</span></label>
        <input id="percent" name="percent" type="number" min="0" max="100" step="1" value="10" required inputmode="numeric" aria-describedby="error">
        <button type="submit">총액 계산하기 <span aria-hidden="true">↗</span></button>
        <p id="error" role="alert"></p>
      </form>
      <div id="result" class="result" aria-live="polite" aria-atomic="true">
        <div class="line"><span>팁</span><output id="tip">—</output></div>
        <div class="total"><span>결제 총액</span><output id="total">—</output></div>
        <p>팁은 원 단위로 반올림합니다.</p>
      </div>
    </section>
    <footer>작은 계산, 간편한 한 끼.</footer>
  </main>
</body>
</html>
